name: build

# Every push and PR builds and gates the binaries, so a tag can never fail on
# something an ordinary commit would have caught. Only a v* tag publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only by the release step below

    steps:
      - uses: actions/checkout@v4

      - name: Build the cross-toolchain image
        run: docker build -t sfp-exporter-toolchain .

      - name: Build
        run: make httpd

      # Asserts the shape the stick can actually load: ELF32, big-endian MIPS,
      # static, no INTERP, no shared deps. Any of these wrong and the binary is
      # silently unrunnable on the device.
      - name: Verify ELF shape
        run: make verify BIN=build/metricsd

      # The ISA gate. Exit 1 means the binary contains an instruction the RLX5281 raises
      # SIGILL on: never publishable. Exit 2 means it contains a mnemonic never
      # executed on real hardware — surfaced loudly, but not a build failure,
      # since the fix is to execute it on a device and extend the PRESENT list.
      - name: Audit instructions against RLX5281
        run: |
          set +e
          make isa BIN=build/metricsd
          rc=$?
          case "$rc" in
            0) echo "::notice::metricsd — every instruction confirmed present on hardware" ;;
            2) echo "::warning::metricsd — contains unverified mnemonics, see log" ;;
            *) echo "::error::metricsd — contains instructions RLX5281 does not implement"; exit 1 ;;
          esac

      # Runs inside the container: build/ belongs to root here, so a host-side
      # redirect into it fails with EACCES on Linux runners.
      - name: Checksums
        run: make sums

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sfp-exporter-${{ github.sha }}
          path: |
            build/metricsd
            build/SHA256SUMS
            stick/exporter-up.sh
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            build/metricsd
            build/SHA256SUMS
            stick/exporter-up.sh
          body: |
            Static big-endian MIPS binaries for RTL9601-based GPON SFP ONU
            sticks. Freestanding — no libc, no shared libraries, nothing to
            install alongside them.

            | file | |
            |---|---|
            | `metricsd` | the exporter; run it as `metricsd [port]`, default 9100 |
            | `exporter-up.sh` | start/stop helper to run on the stick |

            Verified in CI: ELF32, big-endian, MIPS, statically linked, no
            INTERP, and audited against the instructions the RLX5281 is known
            to implement.

            Check `SHA256SUMS` before running anything.
