name: build

# Every push and PR builds and gates the binaries, so a tag can never fail on
# something an ordinary commit would have caught. Only a v* tag publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only by the release step below
      packages: read    # the toolchain image, while its package is private

    steps:
      # fetch-depth 0, because BUILD_ID is `git describe --tags` and the
      # default shallow checkout fetches no tags at all -- so the published
      # binary would report version="unknown" on the very tag that published
      # it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The toolchain image (toolchain.env) is pulled by digest from ghcr.io.
      # Once the package is public this login is unnecessary and harmless;
      # while it is private the pull needs it, and the package must grant
      # this repository read access (package settings, Manage Actions access).
      - name: Log in to ghcr.io (needed only while the toolchain package is private)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull the toolchain image
        run: make image

      - name: Build
        run: make httpd

      # Asserts the shape the stick can actually load: ELF32, big-endian MIPS,
      # static, no INTERP, no shared deps. Any of these wrong and the binary is
      # silently unrunnable on the device.
      - name: Verify ELF shape
        run: make verify BIN=build/metricsd

      # The ISA gate. `make isa` fails when the binary contains an instruction
      # the RLX5281 raises SIGILL on (or floating point): never publishable.
      # A mnemonic never executed on real hardware is printed as UNVERIFIED
      # and surfaced here as a warning, not a failure, since the fix is to
      # execute it on a device and extend the allowlist in odi-toolchain.
      #
      # The failure is read from make exit status being non-zero, never from
      # its value: make exits 2 for ANY failed recipe, so the earlier
      # `case 2) warning` here turned a trapping binary into a warning.
      - name: Audit instructions against RLX5281
        run: |
          set -o pipefail
          make isa BIN=build/metricsd 2>&1 | tee isa.log || {
            echo "::error::metricsd — contains instructions RLX5281 does not implement"; exit 1; }
          if grep -q UNVERIFIED isa.log; then
            echo "::warning::metricsd — contains unverified mnemonics, see log"
          else
            echo "::notice::metricsd — every instruction confirmed present on hardware"
          fi

      # Runs inside the container: build/ belongs to root here, so a host-side
      # redirect into it fails with EACCES on Linux runners.
      - name: Checksums
        run: make sums

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: odi-sfp-exporter-${{ github.sha }}
          path: |
            build/metricsd
            build/SHA256SUMS
            stick/exporter-up.sh
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            build/metricsd
            build/SHA256SUMS
            stick/exporter-up.sh
          body: |
            Static big-endian MIPS binaries for RTL9601-based GPON SFP ONU
            sticks. Freestanding — no libc, no shared libraries, nothing to
            install alongside them.

            | file | |
            |---|---|
            | `metricsd` | the exporter; run it as `metricsd [port]`, default 9100 |
            | `exporter-up.sh` | start/stop helper to run on the stick |

            Verified in CI: ELF32, big-endian, MIPS, statically linked, no
            INTERP, and audited against the instructions the RLX5281 is known
            to implement.

            Check `SHA256SUMS` before running anything.
